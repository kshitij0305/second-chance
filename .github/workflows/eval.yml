# The judge, on a schedule and on demand — deliberately not on every push.
#
# Why it is not a gate:
#   - It is not deterministic. temperature 0 lowers the variance, it does not
#     remove it. A gate that flakes is a gate people learn to re-run.
#   - It needs a secret, so it cannot run on a pull request from a fork.
#
# Cost is NOT one of the reasons, and conflating the two scripts is how this
# file first ended up on a weekly cron. `npm run judge` is ~450 calls against a
# 200,000/day tier and would not survive a busy afternoon of pushes. This runs
# judge:planted, which is ~54 calls. Those are different budgets and they do not
# imply the same schedule.
#
# What it is instead: a drift detector. judge:planted feeds the judge six
# messages that each break exactly one claim on purpose and exits 1 if the judge
# lets any of them pass. That is the check on the checker — without it a green
# `npm run judge` is indistinguishable from a judge that answers yes to
# everything.

name: Eval

on:
  workflow_dispatch:
  schedule:
    # 02:00 UTC daily. judge:planted is ~54 calls, roughly 19,000 tokens — about
    # a tenth of the daily free tier, so there is no reason to space it out. Daily
    # also survives GitHub silently dropping a scheduled run, which it does on
    # free repos under load; a weekly job that gets skipped goes blind for two
    # weeks. Cron here is best-effort, not punctual — this has fired six hours
    # late. Never build anything that assumes otherwise.
    - cron: '0 2 * * *'

jobs:
  planted:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - run: npm run judge:planted
        env:
          # Repo Settings > Secrets and variables > Actions > New repository
          # secret. GitHub masks it in logs; it is still readable by anything
          # this workflow runs, so it stays off pull_request.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      # The results file is gitignored, so without this the run leaves no trace
      # of which claim the judge missed. always(), because a failed run is
      # precisely the one worth reading.
      - if: always()
        uses: actions/upload-artifact@v5
        with:
          name: judge-planted-results
          path: judge_planted_results.json
