<!doctype html>
<meta charset="utf-8">
<title>Second Chance</title>
<style>
  body { font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; margin: 2rem; max-width: 76rem; }
  h1 { font-size: 1.1rem; margin-bottom: 1.2rem; }
  .big { font-size: 2.4rem; font-weight: 700; }
  .sub { color: #666; margin-bottom: .3rem; }
  .alert { color: #b00; font-weight: 600; }
  table { border-collapse: collapse; width: 100%; margin-top: 1.5rem; }
  th, td { text-align: left; padding: .45rem .55rem; border-bottom: 1px solid #ddd; vertical-align: top; }
  th { color: #666; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .recovered { color: #0a7d00; } .failed { color: #b00; } .sent { color: #888; }
  .basis { color: #777; font-size: 11.5px; max-width: 30rem; }
  .ev { font-size: 11px; padding: .05rem .3rem; border-radius: 3px; border: 1px solid; }
  .observed   { color: #0a7d00; border-color: #0a7d00; }
  .documented { color: #a06000; border-color: #a06000; }
  .inferred   { color: #888;    border-color: #bbb; }
  .cls { font-weight: 600; }
</style>
<h1>Second Chance</h1>
<div class="big" id="amount">--</div>
<div class="sub" id="rate">--</div>
<div class="alert" id="failed"></div>
<table><thead><tr>
  <th>payment</th><th>method</th><th>classified as</th><th>on what grounds</th><th>status</th>
</tr></thead><tbody id="rows"></tbody></table>
<script>
const inr = p => "₹" + (p / 100).toLocaleString("en-IN", { maximumFractionDigits: 2 });
async function refresh() {
  const s = await (await fetch("/api/stats")).json();
  document.getElementById("amount").textContent = inr(s.recovered_paise) + " recovered";
  document.getElementById("rate").textContent =
    `${s.recovered || 0} recovered of ${s.attempts} attempts` +
    (s.attempts ? ` (${Math.round(100 * (s.recovered || 0) / s.attempts)}%)` : "");
  document.getElementById("failed").textContent =
    s.failed ? `${s.failed} recovery attempt(s) never went out — see the table` : "";
  document.getElementById("rows").innerHTML = s.recent.map(r => `<tr>
    <td>${r.payment_id}</td>
    <td>${r.method ?? "-"}</td>
    <td><span class="cls">${r.failure_class ?? "-"}</span>
        ${r.evidence ? `<span class="ev ${r.evidence}">${r.evidence}</span>` : ""}</td>
    <td class="basis">${r.basis ?? ""}</td>
    <td class="${r.status}">${r.status}${r.error ? `<div class="basis">${r.error}</div>` : ""}</td>
  </tr>`).join("");
}
refresh(); setInterval(refresh, 3000);
</script>
