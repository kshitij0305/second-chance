<!doctype html>
<meta charset="utf-8">
<title>Second Chance</title>
<style>
  :root {
    --ink: #16181d; --dim: #5f6570; --faint: #8b929c;
    --line: #e4e7ec; --bg: #f7f8fa; --card: #ffffff;
    --good: #0a7a34; --bad: #b3261e; --wait: #0a58c2; --warn: #8a6100;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    font: 18px/1.55 var(--sans); color: var(--ink); background: var(--bg);
    margin: 0; padding: 1.75rem 2rem 4rem;
  }
  .wrap { max-width: 92rem; margin: 0 auto; }

  header { display: flex; align-items: baseline; gap: .75rem; flex-wrap: wrap; }
  h1 { font-size: 1.3rem; margin: 0; font-weight: 650; letter-spacing: -.01em; }
  .tagline { color: var(--dim); font-size: .95rem; }
  .flags { display: flex; gap: .4rem; flex-wrap: wrap; margin: .6rem 0 1.5rem; }
  .flag {
    background: transparent; border: 1px solid #e0d3a8; color: #8a7333;
    padding: .05rem .45rem; border-radius: 999px; font-size: .72rem;
    font-weight: 600; letter-spacing: .02em;
  }

  .stats { display: flex; gap: 2.75rem; flex-wrap: wrap; margin-bottom: 2rem; }
  .stat .n { font-size: 2.6rem; font-weight: 680; line-height: 1; letter-spacing: -.025em; font-variant-numeric: tabular-nums; }
  .stat .l { font-size: .78rem; text-transform: uppercase; letter-spacing: .09em; color: var(--faint); margin-top: .4rem; font-weight: 600; }

  h2 { font-size: .82rem; text-transform: uppercase; letter-spacing: .1em;
       color: var(--faint); font-weight: 700; margin: 0 0 .7rem; }

  .rec {
    background: var(--card); border: 1px solid var(--line); border-radius: 8px;
    border-left: 4px solid var(--line);
    padding: 1.1rem 1.25rem; margin-bottom: .7rem;
    display: grid; grid-template-columns: 1.05fr 1.15fr 1.5fr; gap: 1.5rem;
  }
  .rec.r-scheduled, .rec.r-sending { border-left-color: var(--wait); }
  .rec.r-sent      { border-left-color: #b9c0ca; }
  .rec.r-recovered { border-left-color: var(--good); }
  .rec.r-failed    { border-left-color: var(--bad); }
  .rec.r-expired, .rec.r-superseded { border-left-color: #dfe3e8; }
  .rec .top {
    grid-column: 1 / -1; display: flex; align-items: center; gap: .6rem;
    padding-bottom: .7rem; margin-bottom: .1rem; border-bottom: 1px solid var(--line);
  }
  .pid { font-family: var(--mono); font-size: .88rem; color: var(--dim); }
  .amt { font-weight: 650; font-variant-numeric: tabular-nums; }
  .meth { color: var(--dim); font-size: .95rem; }
  .spacer { flex: 1; }

  .col .k { font-size: .74rem; text-transform: uppercase; letter-spacing: .09em;
            color: var(--faint); font-weight: 700; margin-bottom: .25rem; }
  .col .v { font-family: var(--mono); font-size: .98rem; font-weight: 600; }
  .col .note { color: var(--dim); font-size: .88rem; line-height: 1.45; margin-top: .25rem; }

  .msg { font-size: 1rem; line-height: 1.5; margin-top: .3rem; color: var(--ink); }
  .delivered { color: var(--good); }
  .pending { color: var(--faint); font-style: italic; font-size: .8rem; margin-top: .3rem; }

  .tag { font-size: .72rem; padding: .05rem .35rem; border-radius: 3px; border: 1px solid;
         text-transform: uppercase; letter-spacing: .04em; font-weight: 650; white-space: nowrap; }
  .observed, .model { color: var(--good); border-color: #9ed3b1; background: #f1faf4; }
  .documented { color: var(--warn); border-color: #e3c977; background: #fffaeb; }
  .inferred, .template { color: var(--dim); border-color: var(--line); background: #f6f7f9; }
  .template_after_rejection { color: var(--bad); border-color: #edb4af; background: #fdf3f2; }

  .status { font-size: .86rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
  .s-recovered { color: var(--good); } .s-scheduled, .s-sending { color: var(--wait); }
  .s-sent { color: var(--dim); } .s-failed { color: var(--bad); }
  .s-expired, .s-superseded { color: var(--faint); }
  .due { color: var(--wait); font-variant-numeric: tabular-nums; font-size: .92rem; margin-top: .25rem; }

  table { border-collapse: collapse; width: 100%; background: var(--card);
          border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  th { text-align: left; font-size: .74rem; text-transform: uppercase; letter-spacing: .09em;
       color: var(--faint); font-weight: 700; padding: .55rem .8rem; border-bottom: 1px solid var(--line); }
  td { padding: .6rem .8rem; border-bottom: 1px solid var(--line); font-size: .95rem; }
  tbody tr:last-child td { border-bottom: none; }
  td.v { font-family: var(--mono); font-size: .95rem; }
  .bar { height: 5px; background: #eef0f4; border-radius: 3px; overflow: hidden; width: 120px; display: inline-block; vertical-align: middle; }
  .bar > i { display: block; height: 100%; background: var(--wait); }
  .pct { font-variant-numeric: tabular-nums; color: var(--dim); font-size: .78rem; margin-left: .5rem; }
  .lead { color: var(--good); font-weight: 650; }
  .empty { color: var(--faint); padding: 1.4rem .8rem; font-size: .85rem; }
  .grpstart td { border-top: 1px solid var(--line); }
  section { margin-bottom: 2rem; }
</style>

<div class="wrap">
  <header>
    <h1>Second Chance</h1>
    <span class="tagline">recovering failed payments by working out why they failed</span>
  </header>
  <div class="flags" id="flags"></div>

  <div class="stats">
    <div class="stat"><div class="n" id="handled">0</div><div class="l">failures handled</div></div>
    <div class="stat"><div class="n" id="atrisk">₹0</div><div class="l">revenue at risk</div></div>
    <div class="stat"><div class="n" id="pipeline">0</div><div class="l">recoveries in flight</div></div>
    <div class="stat"><div class="n" id="amount">₹0</div><div class="l">recovered</div><div class="l" id="rate"></div></div>
  </div>

  <section>
    <h2>Recoveries</h2>
    <div id="rows"></div>
  </section>

  <section>
    <h2>What it has learned</h2>
    <table>
      <thead><tr>
        <th style="width:20%">failure class</th>
        <th style="width:28%">plan</th>
        <th style="width:26%">share of traffic</th>
        <th style="width:13%">recovered</th>
        <th style="width:13%">observations</th>
      </tr></thead>
      <tbody id="arms"></tbody>
    </table>
  </section>
</div>

<script>
const inr = p => "₹" + (p / 100).toLocaleString("en-IN", { maximumFractionDigits: 0 });
const esc = s => String(s ?? "").replace(/[<>&]/g, c => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;" }[c]));

function dueIn(iso) {
  if (!iso) return "";
  const secs = Math.round((new Date(iso) - Date.now()) / 1000);
  if (secs <= 0) return "due now";
  if (secs < 90) return "sends in " + secs + "s";
  const mins = Math.round(secs / 60);
  return mins < 90 ? "sends in " + mins + "m" : "sends in " + (mins / 60).toFixed(1) + "h";
}

const sourceLabel = { model: "written by model", template: "template", template_after_rejection: "model output rejected" };

function deliveryLine(r) {
  if (r.delivery_error) return `<div class="note" style="color:var(--bad)">not delivered — ${esc(r.delivery_error)}</div>`;
  if (!r.delivered_at) return "";
  // The console channel writes nothing to anybody. Saying "delivered" for it
  // would be the same lie as an explanation describing a decision never taken.
  if (r.delivery_channel === "console") {
    return `<div class="note">would go to ${esc(r.delivered_to)} — not sent, console channel</div>`;
  }
  return `<div class="note delivered">delivered to ${esc(r.delivered_to)} via ${esc(r.delivery_channel)}</div>`;
}

function recovery(r) {
  return `<div class="rec r-${r.status}">
    <div class="top">
      <span class="amt">${inr(r.amount)}</span>
      <span class="meth">${esc(r.method ?? "unknown method")}</span>
      <span class="pid">${esc(r.payment_id)}</span>
      ${r.attempt_number > 1 ? `<span class="meth">attempt ${r.attempt_number}</span>` : ""}
      <span class="spacer"></span>
      <span class="status s-${r.status}">${r.status}</span>
    </div>

    <div class="col">
      <div class="k">diagnosis</div>
      <div class="v">${esc(r.failure_class ?? "—")}
        ${r.evidence ? `<span class="tag ${r.evidence}">${r.evidence}</span>` : ""}
        ${r.classifier === "model" ? `<span class="tag model">by model</span>` : ""}</div>
      <div class="note">${esc(r.basis)}</div>
    </div>

    <div class="col">
      <div class="k">plan</div>
      <div class="v">${esc(r.strategy)}</div>
      ${r.status === "scheduled" ? `<div class="due">${dueIn(r.scheduled_for)}</div>` : ""}
      ${r.excluded_method ? `<div class="note">${esc(r.excluded_method)} hidden on the checkout</div>` : ""}
      ${r.error ? `<div class="note" style="color:var(--bad)">${esc(r.error)}</div>` : ""}
    </div>

    <div class="col">
      <div class="k">message to the customer
        ${r.message_source ? `<span class="tag ${r.message_source}">${sourceLabel[r.message_source] ?? r.message_source}</span>` : ""}</div>
      ${r.message ? `<div class="msg">${esc(r.message)}</div>` : `<div class="pending">composed when it sends</div>`}
      ${deliveryLine(r)}
    </div>
  </div>`;
}

async function refresh() {
  const s = await (await fetch("/api/stats")).json();

  const flags = [];
  if (s.link_provider === "stub") flags.push("stub links — not real payment links");
  if (s.time_scale > 1) flags.push("time compressed " + s.time_scale + "× — delays are real intent, wall clock is scaled");
  if (s.learning === false) flags.push("learning off — every class uses its default plan");
  if (s.delivery_channel !== "email") flags.push("delivery console — messages are logged, not sent");
  document.getElementById("flags").innerHTML = flags.map(f => `<span class="flag">${f}</span>`).join("");

  const resolved = (s.recovered || 0) + (s.expired || 0);
  document.getElementById("handled").textContent = s.attempts || 0;
  document.getElementById("atrisk").textContent = inr(s.at_risk_paise || 0);
  document.getElementById("pipeline").textContent = (s.scheduled || 0) + (s.sent_pending || 0);
  document.getElementById("amount").textContent = inr(s.recovered_paise);
  // Only claim a rate once something has actually resolved. A percentage over
  // zero outcomes is not a small number, it is no number.
  document.getElementById("rate").textContent = resolved
    ? Math.round(100 * (s.recovered || 0) / resolved) + "% of " + resolved + " resolved"
    : "";

  document.getElementById("rows").innerHTML = s.recent.length
    ? s.recent.map(recovery).join("")
    : `<div class="rec" style="display:block"><div class="empty">No failures yet.</div></div>`;

  const arms = s.arms || [];
  document.getElementById("arms").innerHTML = arms.length ? arms.map(a => `<tr${a.first ? ' class="grpstart"' : ""}>
    <td>${a.first ? esc(a.failure_class) : ""}</td>
    <td class="v ${a.leading ? "lead" : ""}">${esc(a.variant)}</td>
    <td><span class="bar"><i style="width:${Math.round(a.share * 100)}%"></i></span><span class="pct">${Math.round(a.share * 100)}%</span></td>
    <td>${a.observations ? Math.round(a.rate * 100) + "%" : "—"}</td>
    <td style="color:var(--dim)">${a.observations || "never tried"}</td>
  </tr>`).join("") : `<tr><td colspan="5" class="empty">No outcomes yet — the bandit has nothing to learn from until recoveries resolve.</td></tr>`;
}
refresh(); setInterval(refresh, 1000);
</script>
