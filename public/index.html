<!doctype html>
<meta charset="utf-8">
<title>Second Chance</title>
<style>
  body { font: 15px/1.5 ui-monospace, monospace; margin: 2rem; max-width: 60rem; }
  h1 { font-size: 1.2rem; }
  .big { font-size: 2.4rem; font-weight: 700; }
  table { border-collapse: collapse; width: 100%; margin-top: 1.5rem; }
  th, td { text-align: left; padding: .4rem .6rem; border-bottom: 1px solid #ccc; }
  .yes { color: #0a0; } .no { color: #999; }
</style>
<h1>Second Chance</h1>
<div class="big" id="amount">--</div>
<div id="rate">--</div>
<table><thead><tr>
  <th>payment</th><th>method</th><th>error</th><th>strategy</th><th>sent</th><th>recovered</th>
</tr></thead><tbody id="rows"></tbody></table>
<script>
const inr = p => "₹" + (p / 100).toLocaleString("en-IN", { maximumFractionDigits: 2 });
async function refresh() {
  const s = await (await fetch("/api/stats")).json();
  document.getElementById("amount").textContent = inr(s.recovered_paise) + " recovered";
  document.getElementById("rate").textContent =
    `${s.recovered} of ${s.attempts} attempts` +
    (s.attempts ? ` (${Math.round(100 * s.recovered / s.attempts)}%)` : "");
  document.getElementById("rows").innerHTML = s.recent.map(r => `<tr>
    <td>${r.payment_id}</td><td>${r.method ?? "-"}</td>
    <td>${r.error_code ?? "-"}</td><td>${r.strategy}</td>
    <td>${r.sent_at}</td>
    <td class="${r.recovered_at ? "yes" : "no"}">${r.recovered_at ?? "pending"}</td>
  </tr>`).join("");
}
refresh(); setInterval(refresh, 3000);
</script>
